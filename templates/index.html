<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Military Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Система автоматизованої класифікації військової техніки <span class="badge">YOLO v11</span></h1>
    </header>

    <main id="app">
        <section class="card controls">
            <form id="insert_form">

                <div class="control-group">
                    <label for="modelSelect">Оберіть модель</label>
                    <div class="select-wrapper">
                        <select id="modelSelect" name="model_name">
                            <option value="" disabled selected>Завантаження списку...</option>
                        </select>
                    </div>
                </div>

                <div class="control-group">
                    <div class="label-row">
                        <label for="confSlider">Поріг впевненості</label>
                        <span id="confValue" class="mono-text">0.25</span>
                    </div>
                    <input type="range" id="confSlider" name="confidence" min="0.05" max="1.0" step="0.05" value="0.25">
                </div>

                <div class="control-group file-group">
                    <input type="file" name="file" id="imageInput" accept="image/*">
                </div>

                <button type="button" id="detectBtn" class="primary-btn">
                    <span>Розпізнати об'єкт</span>
                </button>
            </form>
        </section>

        <section class="card display-area">
            <div class="result">
                <div id="placeholderText" class="placeholder">Завантажте зображення для аналізу</div>
                <img id="preview" alt="Preview"/>

                <a id="downloadLink" style="display: none;" download="detection_result.png">
                    <button type="button" class="secondary-btn">Завантажити результат</button>
                </a>
            </div>

            <div id="statsBlock" class="stats-bar" style="display: none;">
                <div class="stat-item">
                    <span class="stat-label">Час обробки:</span>
                    <span id="timeVal" class="stat-value">0</span> <span class="unit">мс</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-label">Знайдено:</span>
                    <span id="countVal" class="stat-value">0</span>
                </div>
            </div>

            <table id="resultsTable" class="styled-table">
                <thead>
                  <tr>
                    <th>Клас об'єкта</th>
                    <th>Впевненість (Confidence)</th>
                  </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>
</div>

<script type="module" src="/static/js/main.js"></script>

<script>
    document.getElementById('imageInput').addEventListener('change', function() {
        if (this.files && this.files[0]) {
            document.getElementById('placeholderText').style.display = 'none';
        }
    });
</script>
</body>
</html>
